name: CI

# A esteira inteira mora em slipalison/github-workflows (pipeline.yml):
#
#   qualidade   gofmt, golangci-lint (.golangci.yml, com gosec), go vet,
#               go test -race e piso de cobertura
#   imagem      build do Dockerfile, Trivy na imagem ANTES de publicar,
#               ghcr.io/slipalison/comporta:sha-<commit>
#   seguranca   Gitleaks e TruffleHog no historico inteiro, Semgrep,
#               Trivy (SCA do go.mod), SBOM e CodeQL (Go)
#   sonar       SonarQube Cloud com cobertura e Quality Gate
#   versao      Conventional Commits -> proxima versao; na main, tag, release
#               e o alias :<versao> da imagem
#
# Sem deploy: o Comporta roda onde cada um quiser (docker compose), entao
# `app` fica vazio e o job `publicar` (GitOps) sai pulado.
#
# Docker Hub: o job `dockerhub` copia para docker.io a mesma imagem que a
# esteira publicou no GHCR, so na main e so quando sai versao nova.
#
# O check a exigir no ruleset da main e `esteira / Portao`.
#
# Repositorio publico: os minutos de Actions sao gratuitos.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  esteira:
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read
    uses: slipalison/github-workflows/.github/workflows/pipeline.yml@main
    with:
      componentes: '[{"nome":"comporta","linguagem":"go","versao":"1.27","cobertura":60}]'
      imagem: ghcr.io/slipalison/comporta
      versao_inicial: "0.1.0"
      linguagens_codeql: '["go"]'
      sonar_projeto: slipalison_comporta
      sonar_linguagem: go
      sonar_versao_linguagem: "1.27"
      sonar_comando_testes: "go test ./... -coverpkg=./... -coverprofile=coverage.out"
      sonar_parametros: |
        sonar.sources=.
        sonar.exclusions=**/*_test.go
        sonar.tests=.
        sonar.test.inclusions=**/*_test.go
        sonar.go.coverage.reportPaths=coverage.out
        sonar.coverage.exclusions=internal/web/static/**
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dockerhub:
    # Copia, nao reconstroi: `imagetools create` aponta docker.io/<usuario>/
    # comporta:<versao> e :latest para o MESMO manifesto de ghcr.io, o que o
    # Trivy varreu antes de publicar. Roda depois da esteira inteira (o
    # `lancar` dela ja criou ghcr.io/...:<versao>), so num push na main que
    # gerou versao nova.
    needs: esteira
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.esteira.result == 'success'
      && needs.esteira.outputs.versao != ''
      && needs.esteira.outputs.salto != 'nenhum'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Endurecer o runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Conferir os secrets
        # Secret ausente nao da erro: o login sairia com usuario vazio e a
        # mensagem nao diria o motivo.
        env:
          USUARIO: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$USUARIO" ] || [ -z "$TOKEN" ]; then
            echo "::error::Faltam os secrets DOCKERHUB_USERNAME e DOCKERHUB_TOKEN."
            exit 1
          fi
          # Usuario do Docker Hub: 4 a 30 caracteres, minusculas e digitos.
          # Um token (dckr_pat_...) aqui significa os dois secrets trocados.
          if ! [[ "$USUARIO" =~ ^[a-z0-9]{4,30}$ ]]; then
            echo "::error::DOCKERHUB_USERNAME nao parece um usuario do Docker Hub (4 a 30 minusculas e digitos). Os dois secrets estao trocados?"
            exit 1
          fi

      - name: Login no Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copiar a imagem do GHCR
        env:
          USUARIO: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSAO: ${{ needs.esteira.outputs.versao }}
        run: |
          set -euo pipefail
          [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::versao invalida: $VERSAO"; exit 1; }
          origem="ghcr.io/slipalison/comporta:${VERSAO}"
          destino="docker.io/${USUARIO}/comporta"
          docker buildx imagetools create --tag "${destino}:${VERSAO}" --tag "${destino}:latest" "$origem"
          docker buildx imagetools inspect "${destino}:${VERSAO}"
          {
            echo "## Docker Hub"
            echo ""
            echo "\`docker pull ${destino}:${VERSAO}\` (tambem \`:latest\`), copiada de \`${origem}\`."
          } >> "$GITHUB_STEP_SUMMARY"
