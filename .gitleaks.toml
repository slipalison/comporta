# Gitleaks exceptions, by VALUE and only for the rule that flagged it: a real
# secret added to the same file later is still caught.

[extend]
useDefault = true

[[allowlists]]
description = "Example MCP token: the 16 characters 0-9a-f in order (the shortest the server accepts). Used in the README development command (since the original db-mcp commit) and in main_test.go. It authenticates nothing: the server only accepts the tokens its operator sets in the environment."
targetRules = ["generic-api-key"]
regexes = ['''^0123456789abcdef$''']
