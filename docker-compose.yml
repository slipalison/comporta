services:
  comporta:
    build:
      context: .
      args:
        VERSION: ${COMPORTA_VERSION:-dev}
    # Para usar a imagem publicada: image: ghcr.io/slipalison/comporta:<versão>
    image: comporta:dev
    container_name: comporta
    restart: unless-stopped
    env_file: .env
    ports:
      # Só em localhost: a UI decide o que a IA pode fazer.
      - "127.0.0.1:${COMPORTA_PORT:-7843}:8080"
    volumes:
      - comporta-data:/data
    extra_hosts:
      # permite alcançar bancos que rodam no host
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m

volumes:
  comporta-data:
