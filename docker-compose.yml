services:
  comporta:
    build:
      context: .
      args:
        VERSION: ${COMPORTA_VERSION:-dev}
    # Builds from this folder. To use the published image instead, remove
    # `build` and set: image: slipalison/comporta:<version>
    image: comporta:dev
    container_name: comporta
    restart: unless-stopped
    env_file: .env
    ports:
      # Localhost only: the admin UI decides what the AI may do.
      - "127.0.0.1:${COMPORTA_PORT:-7843}:8080"
    volumes:
      - comporta-data:/data
    extra_hosts:
      # lets connections reach databases running on the host
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m

volumes:
  comporta-data:
