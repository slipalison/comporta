# Lint config, used by CI (github-workflows, go component) and locally.
version: "2"
linters:
  enable:
    - gosec        # security: built SQL, file paths, crypto
    - errorlint    # errors.Is/As instead of == and type switches
    - bodyclose
    - noctx        # every network call takes a context
    - sqlclosecheck
    - rowserrcheck
    - nilerr
    - misspell
    - unconvert
    - gocritic
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true   # internal packages: a doc comment on every export is noise
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      # DSN examples shown in the UI, with fake passwords.
      - path: internal/model/model.go
        text: "G101"
      - path: _test\.go
        linters: [gosec, noctx]
formatters:
  enable: [gofmt, goimports]
